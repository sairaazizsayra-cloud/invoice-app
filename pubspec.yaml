name: invoice_pro
description: "InvoicePro – Billing Manager. A production-ready invoice and billing management application."
publish_to: "none"

# Android versionName is the version before +, versionCode is the build number after +.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  image_picker: ^1.2.3
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  firebase_app_check: ^0.4.7
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# firebase_core 4.14.0 pulls firebase_core_web 3.11.0, which calls Object.isA()
# and only compiles on Dart 3.12+. This project is on Flutter 3.41.9 / Dart 3.11.5.
# Remove this override once a patched firebase_core_web (>=3.11.1) is on pub.dev.
# See https://github.com/firebase/flutterfire/issues/18611
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
